<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 학습 플래시카드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .correct { background-color: #10b981 !important; color: white !important; }
        .incorrect { background-color: #ef4444 !important; color: white !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                <i class="fas fa-graduation-cap text-indigo-600 mr-3"></i>구동사 학습 플래시카드
            </h1>
            <p class="text-gray-600">미국인이 자주 사용하는 구동사를 학습해보세요!</p>
        </header>

        <!-- 점수 표시 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div class="text-center">
                    <div class="text-2xl font-bold text-indigo-600" id="currentScore">0</div>
                    <div class="text-sm text-gray-600">현재 점수</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-600" id="currentQuestion">1</div>
                    <div class="text-sm text-gray-600">문제 번호</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-600" id="totalQuestions">10</div>
                    <div class="text-sm text-gray-600">총 문제</div>
                </div>
            </div>
        </div>

        <!-- 진행 바 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">진행 상황</span>
                <span class="text-sm font-medium text-gray-700" id="progressText">1/10</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div class="bg-indigo-600 h-3 rounded-full transition-all duration-300" id="progressBar" style="width: 10%"></div>
            </div>
        </div>

        <!-- 메인 학습 영역 -->
        <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
            <!-- 시작 화면 -->
            <div id="startScreen" class="text-center">
                <div class="text-center mb-8">
                    <i class="fas fa-book-open text-6xl text-indigo-600 mb-4"></i>
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">구동사 학습 시작하기</h2>
                    <p class="text-gray-600 mb-6">미국인들이 자주 사용하는 구동사를 학습하고 점수를 확인해보세요!</p>
                </div>
                <button onclick="startQuiz()" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
                    <i class="fas fa-play mr-2"></i>시작하기
                </button>
            </div>

            <!-- 퀴즈 화면 -->
            <div id="quizScreen" class="hidden">
                <!-- 단어 표시 -->
                <div class="text-center mb-8">
                    <div class="text-5xl font-bold text-gray-800 mb-4" id="currentWord"></div>
                    <div class="text-gray-600">다음 중 이 구동사의 뜻은 무엇일까요?</div>
                </div>

                <!-- 선택지 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <button onclick="selectAnswer(0)" class="quiz-option bg-gray-50 hover:bg-indigo-50 border-2 border-gray-200 hover:border-indigo-300 rounded-lg p-6 text-left transition-all duration-200" id="option0">
                        <div class="flex items-center">
                            <span class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold mr-4">1</span>
                            <span class="text-lg font-medium" id="optionText0"></span>
                        </div>
                    </button>
                    <button onclick="selectAnswer(1)" class="quiz-option bg-gray-50 hover:bg-indigo-50 border-2 border-gray-200 hover:border-indigo-300 rounded-lg p-6 text-left transition-all duration-200" id="option1">
                        <div class="flex items-center">
                            <span class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold mr-4">2</span>
                            <span class="text-lg font-medium" id="optionText1"></span>
                        </div>
                    </button>
                    <button onclick="selectAnswer(2)" class="quiz-option bg-gray-50 hover:bg-indigo-50 border-2 border-gray-200 hover:border-indigo-300 rounded-lg p-6 text-left transition-all duration-200" id="option2">
                        <div class="flex items-center">
                            <span class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold mr-4">3</span>
                            <span class="text-lg font-medium" id="optionText2"></span>
                        </div>
                    </button>
                    <button onclick="selectAnswer(3)" class="quiz-option bg-gray-50 hover:bg-indigo-50 border-2 border-gray-200 hover:border-indigo-300 rounded-lg p-6 text-left transition-all duration-200" id="option3">
                        <div class="flex items-center">
                            <span class="bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold mr-4">4</span>
                            <span class="text-lg font-medium" id="optionText3"></span>
                        </div>
                    </button>
                </div>

                <!-- 예문 표시 영역 -->
                <div id="exampleSection" class="hidden mb-8">
                    <div class="bg-green-50 border-l-4 border-green-400 p-4 rounded-lg">
                        <div class="flex items-center mb-2">
                            <i class="fas fa-lightbulb text-green-500 mr-2"></i>
                            <span class="font-semibold text-green-800">예문</span>
                        </div>
                        <p id="exampleText" class="text-green-700 italic"></p>
                    </div>
                </div>

                <!-- 다음 문제 버튼 -->
                <div class="text-center">
                    <button onclick="nextQuestion()" class="bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors hidden" id="nextButton">
                        <i class="fas fa-arrow-right mr-2"></i>다음 문제
                    </button>
                </div>
            </div>

            <!-- 결과 화면 -->
            <div id="resultScreen" class="hidden text-center">
                <div class="mb-8">
                    <i class="fas fa-trophy text-6xl text-yellow-500 mb-4"></i>
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">학습 완료!</h2>
                    <div class="text-6xl font-bold text-indigo-600 mb-2" id="finalScore"></div>
                    <div class="text-gray-600 mb-6">10개 중 <span id="correctCount"></span>개 맞추셨어요!</div>
                </div>
                <div class="flex justify-center gap-4">
                    <button onclick="restartQuiz()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
                        <i class="fas fa-redo mr-2"></i>다시하기
                    </button>
                    <button onclick="showScores()" class="bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-700 transition-colors">
                        <i class="fas fa-history mr-2"></i>점수 기록
                    </button>
                </div>
            </div>
        </div>

        <!-- 점수 기록 -->
        <div id="scoresScreen" class="bg-white rounded-lg shadow-lg p-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">점수 기록</h3>
                <button onclick="hideScores()" class="text-gray-600 hover:text-gray-800">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="scoresList" class="space-y-3">
                <div class="text-center text-gray-600 py-8">
                    <i class="fas fa-chart-line text-4xl mb-4"></i>
                    <p>점수 기록이 없습니다.</p>
                </div>
            </div>
        </div>

        <!-- 단어 관리 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-cog text-indigo-600 mr-2"></i>구동사 관리
            </h3>
            <div class="flex flex-wrap gap-4">
                <button onclick="loadWords()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fas fa-sync mr-2"></i>단어 다시 불러오기
                </button>
                <button onclick="showWordEditor()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                    <i class="fas fa-edit mr-2"></i>단어 편집
                </button>
                <input type="file" id="wordFile" accept=".txt" onchange="handleFileUpload(event)" class="hidden">
                <label for="wordFile" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors cursor-pointer">
                    <i class="fas fa-upload mr-2"></i>파일 업로드
                </label>
            </div>
            <div class="mt-4 text-sm text-gray-600">
                <p><i class="fas fa-info-circle mr-1"></i>구동사 파일 형식: "구동사,의미,예문" 형식으로 작성하세요.</p>
            </div>
        </div>
    </div>

    <!-- 단어 편집 모달 -->
    <div id="wordEditorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">단어 편집기</h3>
                <button onclick="hideWordEditor()" class="text-gray-600 hover:text-gray-800">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <textarea id="wordEditor" class="w-full h-64 p-3 border border-gray-300 rounded-lg resize-none font-mono text-sm"></textarea>
            <div class="flex justify-end gap-4 mt-4">
                <button onclick="hideWordEditor()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition-colors">취소</button>
                <button onclick="saveWords()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">저장</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
